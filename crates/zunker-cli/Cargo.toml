[package]
name = "zunker-cli"
version = "0.1.0"
description = "Command-line entry point for Zunker Post"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
getrandom = "0.4"
hex = "0.4.3"
orchard = { version = "0.16", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zeroize = "1"
zip32 = "0.3"
zip321 = "0.10"
zunker-client = { version = "0.1.0", path = "../zunker-client" }
zunker-core = { version = "0.1.0", path = "../zunker-core" }
zunker-server = { version = "0.1.0", path = "../zunker-server" }
