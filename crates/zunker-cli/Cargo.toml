[package]
name = "zunker-cli"
version = "0.1.0"
description = "Command-line entry point for Zunker Post"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zunker-server = { version = "0.1.0", path = "../zunker-server" }
