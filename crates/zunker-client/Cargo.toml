[package]
name = "zunker-client"
version = "0.1.0"
description = "Wallet-side client for Zcash Wallet-to-Wallet Messaging (ZIP draft #1435)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
arti-client = { version = "0.48", default-features = false, features = ["tokio", "rustls", "onion-service-client", "compression"] }
getrandom = "0.4"
hex = "0.4.3"
orchard = { version = "0.16", default-features = false, features = ["std"] }
rand = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# Keep the `sapling` feature off: it changes `UnifiedAddress::from_receivers`.
zcash_keys = { version = "0.17", default-features = false, features = ["std", "orchard"] }
zcash_protocol = "0.11"
zip321 = "0.10"
tokio = { version = "1.54.1", features = ["net", "io-util", "time"] }
tokio-socks = "0.5"
tor-rtcompat = { version = "0.48", default-features = false, features = ["tokio", "rustls"] }
zunker-core = { version = "0.1.0", path = "../zunker-core" }
zunker-wire = { version = "0.1.0", path = "../zunker-wire" }

[dev-dependencies]
# Real servers for the integration tests only; the library does not use it.
zunker-server = { version = "0.1.0", path = "../zunker-server" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
