# tor + zunker-server: a Mailbox Server reachable only as a v3 onion service.
#
#   cp deploy/server.toml.example deploy/server.toml   # set server_id
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml exec tor cat /var/lib/tor/zunker/hostname
#
# No ports are published. zunker-server runs in tor's network namespace and
# listens on 127.0.0.1:7878, which only the onion service can reach.
# Spec: spec/zip-draft-1435.md § Routing (L332-350), Appendix A, Tor (L490-501).

services:
  tor:
    build: ./tor
    restart: unless-stopped
    volumes:
      # The onion service keys, i.e. the server's address. Back this up.
      - tor-data:/var/lib/tor

  zunker-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    network_mode: "service:tor"
    depends_on:
      - tor
    command: ["serve", "--config", "/etc/zunker/server.toml"]
    volumes:
      - ./server.toml:/etc/zunker/server.toml:ro
      - zunker-data:/var/lib/zunker

volumes:
  tor-data:
  zunker-data:
